version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: axebtc-app
      APP_PORT: 3000
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  init:
    image: alpine:3.22.1
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}:/appdata
      - ${APP_DATA_DIR}/data/templates:/data/templates:rw
    environment:
      APPS_SUBNET: "${NETWORK_IP}/16"
      RPC_USER: "btc"
      RPC_PASSWORD: "${APP_PASSWORD}"
      BTC_P2P_PORT: "28333"
      BTC_RPC_PORT: "28332"
      BTC_ZMQ_HASHBLOCK_PORT: "28335"
      PAYOUT_ADDRESS: "CHANGEME_BTC_PAYOUT_ADDRESS"
    command:
      - /bin/sh
      - -ec
      - |-
        set -eu

        # BEGIN REVIEWED POOL SUPERVISOR MIGRATION
        # Compose is replaced on ordinary updates; persistent data/templates is not.
        pool_migration_refuse() {
          echo "Pool supervisor migration refused: keep custom files unchanged and restore the reviewed regular template before updating." >&2
          exit 1
        }
        pool_migration_check() {
          [ -d /data ] && [ ! -L /data ] || return 1
          [ -d /data/templates ] && [ ! -L /data/templates ] || return 1
          [ -f "$$pool_wrapper" ] && [ ! -L "$$pool_wrapper" ] || return 1
          [ "$$(stat -c '%h' "$$pool_wrapper")" = 1 ] || return 1
          [ "$$(stat -c '%s' "$$pool_wrapper")" -le 16384 ] || return 1
          pool_wrapper_metadata="$$(stat -c '%d:%i:%h:%s:%a:%u:%g:%Y:%Z' "$$pool_wrapper")" || return 1
          pool_wrapper_hash="$$(sha256sum "$$pool_wrapper" | awk '{print $$1}')" || return 1
        }
        pool_wrapper=/data/templates/ckpool-entrypoint.sh
        pool_migration_check || pool_migration_refuse
        case "$$pool_wrapper_hash" in
          113b01035df42190328e2bc449b4daae5d59ec1dbca09a8199d699da97228f4a) ;;
          656f5dd87ad73ab5a0fe87e41616981a7192bba7802880bd6007f0fb37165850)
            pool_old_metadata="$$pool_wrapper_metadata"
            pool_migration_tmp="$$(mktemp /data/templates/.ckpool-entrypoint.XXXXXXXX)" || pool_migration_refuse
            trap 'rm -f "$$pool_migration_tmp"' EXIT
            trap 'exit 1' TERM INT
            cp -p "$$pool_wrapper" "$$pool_migration_tmp" || pool_migration_refuse
            [ "$$(sha256sum "$$pool_migration_tmp" | awk '{print $$1}')" = 656f5dd87ad73ab5a0fe87e41616981a7192bba7802880bd6007f0fb37165850 ] || pool_migration_refuse
            base64 -d >"$$pool_migration_tmp" <<'REVIEWED_POOL_SUPERVISOR'
        IyEvYmluL3NoCnNldCAtZXUKCkNGRz0iL2NvbmZpZy9ja3Bvb2wuY29uZiIKQVJHU19GSUxFPSIv
        Y29uZmlnL2NrcG9vbC5hcmdzIgoKcm0gLWYgL3RtcC9ja3Bvb2wvKi5waWQgMj4vZGV2L251bGwg
        fHwgdHJ1ZQoKY2twb29sX2Jpbj0iIgppZiBjb21tYW5kIC12IGNrcG9vbCA+L2Rldi9udWxsIDI+
        JjE7IHRoZW4KICBja3Bvb2xfYmluPSJja3Bvb2wiCmVsaWYgWyAteCAvYmluL2NrcG9vbCBdOyB0
        aGVuCiAgY2twb29sX2Jpbj0iL2Jpbi9ja3Bvb2wiCmVsaWYgWyAteCAvdXNyL2Jpbi9ja3Bvb2wg
        XTsgdGhlbgogIGNrcG9vbF9iaW49Ii91c3IvYmluL2NrcG9vbCIKZWxzZQogIGVjaG8gIltheGVi
        dGNdIEVSUk9SOiBja3Bvb2wgYmluYXJ5IG5vdCBmb3VuZCBpbiBpbWFnZSIgPiYyCiAgZXhpdCAx
        CmZpCgpjaGVja3N1bSgpIHsKICBpZiBbICEgLWYgIiRDRkciIF07IHRoZW4KICAgIGVjaG8gIiIK
        ICAgIHJldHVybiAwCiAgZmkKICBja3N1bSAiJENGRyIgMj4vZGV2L251bGwgfCBhd2sgJ3twcmlu
        dCAkMSAiOiIgJDJ9Jwp9CgpzdGFydF9ja3Bvb2woKSB7CiAgaWYgWyAhIC1mICIkQ0ZHIiBdOyB0
        aGVuCiAgICByZXR1cm4gMAogIGZpCiAgQVJHUz0iJChjYXQgIiRBUkdTX0ZJTEUiIDI+L2Rldi9u
        dWxsIHx8IHRydWUpIgogICMgc2hlbGxjaGVjayBkaXNhYmxlPVNDMjA4NgogICIkY2twb29sX2Jp
        biIgLWsgLUwgLWMgIiRDRkciICRBUkdTICYKICBwaWQ9IiQhIgp9CgpsYXN0PSIiCnBpZD0iIgpw
        b2xsX3BpZD0iIgoKc3RvcF9ja3Bvb2woKSB7CiAgaWYgWyAtbiAiJHBpZCIgXTsgdGhlbgogICAg
        a2lsbCAtVEVSTSAiJHBpZCIgMj4vZGV2L251bGwgfHwgdHJ1ZQogICAgd2FpdCAiJHBpZCIgMj4v
        ZGV2L251bGwgfHwgdHJ1ZQogICAgcGlkPSIiCiAgZmkKfQoKdGVybWluYXRlX3Bvb2woKSB7CiAg
        dHJhcCAnJyBURVJNIElOVAogIGlmIFsgLW4gIiRwb2xsX3BpZCIgXTsgdGhlbgogICAga2lsbCAt
        VEVSTSAiJHBvbGxfcGlkIiAyPi9kZXYvbnVsbCB8fCB0cnVlCiAgICB3YWl0ICIkcG9sbF9waWQi
        IDI+L2Rldi9udWxsIHx8IHRydWUKICAgIHBvbGxfcGlkPSIiCiAgZmkKICBzdG9wX2NrcG9vbAog
        IGV4aXQgMAp9Cgp0cmFwIHRlcm1pbmF0ZV9wb29sIFRFUk0gSU5UCgp3aGlsZSB0cnVlOyBkbwog
        IHN1bT0iJChjaGVja3N1bSkiCgogIGlmIFsgIiRzdW0iICE9ICIkbGFzdCIgXTsgdGhlbgogICAg
        bGFzdD0iJHN1bSIKICAgIHN0b3BfY2twb29sCiAgICBzdGFydF9ja3Bvb2wKICAgIGlmIFsgLW4g
        IiR7cGlkOi19IiBdOyB0aGVuCiAgICAgIGVjaG8gIltheGVidGNdIGNrcG9vbCBzdGFydGVkIChw
        aWQgJHtwaWR9KSIKICAgIGVsc2UKICAgICAgZWNobyAiW2F4ZWJ0Y10gd2FpdGluZyBmb3IgY2tw
        b29sLmNvbmYuLi4iCiAgICBmaQogIGZpCgogIGlmIFsgLW4gIiR7cGlkOi19IiBdICYmICEga2ls
        bCAtMCAiJHBpZCIgMj4vZGV2L251bGw7IHRoZW4KICAgIHdhaXQgIiRwaWQiIDI+L2Rldi9udWxs
        IHx8IHRydWUKICAgIHBpZD0iIgogIGZpCgogIHNsZWVwIDIgJgogIHBvbGxfcGlkPSIkISIKICB3
        YWl0ICIkcG9sbF9waWQiIDI+L2Rldi9udWxsIHx8IHRydWUKICBwb2xsX3BpZD0iIgpkb25lCg==
        REVIEWED_POOL_SUPERVISOR
            [ "$$(sha256sum "$$pool_migration_tmp" | awk '{print $$1}')" = 113b01035df42190328e2bc449b4daae5d59ec1dbca09a8199d699da97228f4a ] || pool_migration_refuse
            touch -r "$$pool_wrapper" "$$pool_migration_tmp" || pool_migration_refuse
            pool_migration_check || pool_migration_refuse
            [ "$$pool_wrapper_hash" = 656f5dd87ad73ab5a0fe87e41616981a7192bba7802880bd6007f0fb37165850 ] && [ "$$pool_wrapper_metadata" = "$$pool_old_metadata" ] || pool_migration_refuse
            mv -f "$$pool_migration_tmp" "$$pool_wrapper" || pool_migration_refuse
            trap - EXIT TERM INT
            ;;
          *) pool_migration_refuse ;;
        esac
        # END REVIEWED POOL SUPERVISOR MIGRATION

        apk add --no-cache envsubst jq >/dev/null

        # Persist JWT secret into ${APP_DATA_DIR}/.env so that SSH restarts
        # (without exports.sh) don't boot app_proxy with an empty JWT_SECRET.
        if [ -n "$${JWT_SECRET:-}" ]; then
          envfile="/appdata/.env"
          tmp="/appdata/.env.tmp"
          if [ -f "$$envfile" ]; then
            grep -v '^JWT_SECRET=' "$$envfile" > "$$tmp" || true
          else
            : > "$$tmp"
          fi
          printf "JWT_SECRET=%s\n" "$$JWT_SECRET" >> "$$tmp"
          chmod 600 "$$tmp" || true
          chown 1000:1000 "$$tmp" || true
          mv "$$tmp" "$$envfile"
        fi

        mkdir -p /data/node /data/pool/config /data/pool/www/pool /data/pool/www/users
        # Ensure template scripts are executable (Windows checkouts can lose +x).
        chmod +x /data/templates/bitcoind-entrypoint.sh /data/templates/ckpool-entrypoint.sh 2>/dev/null || true
        chown 1000:1000 /data/templates/bitcoind-entrypoint.sh /data/templates/ckpool-entrypoint.sh 2>/dev/null || true

        # Migration/repair:
        # Older installs may have persisted an AxeBTCF-era ckpool.conf.template (merged-mining/Fractal).
        # Because templates live in the persistent /data volume, store updates do not automatically replace them.
        #
        # NOTE: avoid embedding a full JSON template directly in this command block because 5tratumos/umbrel
        # tooling rewrites docker-compose.yml and can choke on lots of unescaped quotes.
        if [ -f /data/templates/ckpool.conf.template ]; then
          if grep -q '"auxd"' /data/templates/ckpool.conf.template; then
            # Drop the auxd block (merged mining).
            sed -i '/"auxd"[[:space:]]*:/,/^  ],/d' /data/templates/ckpool.conf.template || true
          fi
          # Drop auxaddress (merged mining).
          sed -i '/"auxaddress"[[:space:]]*:/d' /data/templates/ckpool.conf.template || true
          # Fix signature string.
          sed -i 's#/AxeBTCF/#/AxeBTC/#g' /data/templates/ckpool.conf.template || true
        fi

        # The host may create settings.yml as root during update/install; ensure it stays writable.
        touch /appdata/settings.yml
        chown 1000:1000 /appdata/settings.yml || true

        if [ ! -f /data/node/bitcoin.conf ]; then
          envsubst < /data/templates/bitcoin.conf.template > /data/node/bitcoin.conf
          chown -R 1000:1000 /data/node
        else
          # Keep peer limit high on existing installs too.
          if grep -q '^maxconnections=' /data/node/bitcoin.conf; then
            sed -i 's/^maxconnections=.*/maxconnections=256/' /data/node/bitcoin.conf
          else
            echo '' >> /data/node/bitcoin.conf
            echo 'maxconnections=256' >> /data/node/bitcoin.conf
          fi
          chown 1000:1000 /data/node/bitcoin.conf || true
        fi

        if [ ! -f /data/pool/config/ckpool.conf ]; then
          envsubst < /data/templates/ckpool.conf.template > /data/pool/config/ckpool.conf
          chown -R 1000:1000 /data/pool
        else
          # Upgrade safety:
          # - Ensure ckpool.conf has webdir/userdir so worker stats are written.
          # - Remove any AuxPoW (Fractal) config keys from older AxeBTCF installs.
          existing_addr="$$(grep -oE '\"btcaddress\"[[:space:]]*:[[:space:]]*\"[^\"]*\"' /data/pool/config/ckpool.conf | head -n 1 | cut -d: -f2- | tr -d ' \"' || true)"
          needs_ckpool_regen=0
          # If ckpool.conf isn't valid JSON, regenerate it (fixes broken escapes like "btcaddress": "\1").
          if ! jq -e . /data/pool/config/ckpool.conf >/dev/null 2>&1; then
            needs_ckpool_regen=1
          fi
          if ! grep -q '"btcaddress"' /data/pool/config/ckpool.conf; then
            needs_ckpool_regen=1
          fi
          if ! grep -q '"webdir"' /data/pool/config/ckpool.conf; then
            needs_ckpool_regen=1
          fi
          if ! grep -q '"userdir"' /data/pool/config/ckpool.conf; then
            needs_ckpool_regen=1
          fi
          # Upgrade safety: remove legacy merged-mining config (AxeBTCF).
          if grep -q '"auxd"' /data/pool/config/ckpool.conf; then
            needs_ckpool_regen=1
          fi
          if grep -q '"auxaddress"' /data/pool/config/ckpool.conf; then
            needs_ckpool_regen=1
          fi
          if grep -q '/AxeBTCF/' /data/pool/config/ckpool.conf; then
            needs_ckpool_regen=1
          fi
          # Repair: invalid JSON caused by an escaped backreference (e.g. "btcaddress": "\1").
          case "$$existing_addr" in
            *\\*) needs_ckpool_regen=1 ;;
          esac
          if [ "$$needs_ckpool_regen" -eq 1 ]; then
            # Preserve a valid existing payout address when regenerating.
            case "$$existing_addr" in
              bc1*|1*|3*)
                if [ "$$existing_addr" != "CHANGEME_BTC_PAYOUT_ADDRESS" ]; then
                  export PAYOUT_ADDRESS="$$existing_addr"
                fi
                ;;
            esac
            mv /data/pool/config/ckpool.conf "/data/pool/config/ckpool.conf.bak.$(date +%s 2>/dev/null || echo 0)" || true
            envsubst < /data/templates/ckpool.conf.template > /data/pool/config/ckpool.conf
            chown -R 1000:1000 /data/pool
          fi
        fi

        if [ ! -f /data/pool/config/ckpool.args ]; then
          echo "-B" > /data/pool/config/ckpool.args
          chown 1000:1000 /data/pool/config/ckpool.args || true
        fi

  bitcoind:
    image: ghcr.io/willitmod/axebtc-bitcoind-switch:0.7.44
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 15m30s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data/node:/data
      - ${APP_DATA_DIR}/data/templates/bitcoind-entrypoint.sh:/bitcoind-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/bitcoind-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -datadir=/data getblockchaininfo >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 2m

  ckpool:
    image: ghcr.io/willitmod/docker-ckpool-solo:590fb2a
    user: "1000:1000"
    depends_on:
      - bitcoind
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - "7890:3333/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/pool/config:/config:ro
      - ${APP_DATA_DIR}/data/pool/www:/www
      - ${APP_DATA_DIR}/data/templates/ckpool-entrypoint.sh:/ckpool-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/ckpool-entrypoint.sh"]

  app:
    stop_signal: SIGINT
    hostname: axebtc-app
    image: ghcr.io/willitmod/axebtc-app-umbrel-dev:0.7.82.17@sha256:21334b67d803987a3ae4e79242ba2d74da0415d22e786783c73723a460d9c174
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      - bitcoind
      - ckpool
    networks:
      default:
        aliases:
          - axebtc-app
      umbrel_main_network:
        aliases:
          - axebtc-app
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_REVISION: 27734d195a01149dba1f5ce9837dd00e2afc049a
      MUX_IDENTITY_URL: "http://172.17.0.1:21222/api/integrations/workers"
      BTC_RPC_HOST: "bitcoind"
      BTC_RPC_PORT: "28332"
      BTC_RPC_USER: "btc"
      BTC_RPC_PASS: "${APP_PASSWORD}"
      CKPOOL_STATUS_DIR: "/data/pool/www/pool"
      CKPOOL_STRATUM_HOST: "ckpool"
      CKPOOL_STRATUM_PORT: "3333"
      APP_CHANNEL: "MAIN"
      APP_VERSION_SUFFIX: ""
      BITCOIND_IMAGE: "ghcr.io/willitmod/axebtc-bitcoind-switch:0.7.44"
      CKPOOL_IMAGE: "ghcr.io/willitmod/docker-ckpool-solo:590fb2a"
      STATIC_DIR: "/app/static"

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
