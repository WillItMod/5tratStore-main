manifestVersion: 1
id: willitmod-btc
category: bitcoin
name: AxeBTC
version: "0.7.82.11"
tagline: BTC node + solo pool
description: >-
  RC1 RELEASE

  AxeBTC is functional and has completed extended DEV-channel testing. It has
  not hit a solo block yet, but
  that is expected at typical solo-mining odds and is not a sign that the app is
  failing.

  Verify payout addresses and pool settings before mining, and send helpful
  feedback if anything behaves oddly.

  Run a Bitcoin (BTC) full node (Bitcoin Core or Bitcoin Knots) and an integrated solo Stratum v1 pool (ckpool) as a single app.

  Miner connection:
    - URL: `stratum+tcp://<your-host-ip>:7890`
    - Username: worker name (optional)
    - Password: anything


  Notes:
    - Initial sync can take a long time and a lot of bandwidth/storage (the node downloads and validates the chain).
    - Blockchains can carry arbitrary data (e.g. via `OP_RETURN`). That’s not unique to any one chain.
    - Set your payout address in the app Settings tab.
    - Pool settings apply automatically; miners may briefly reconnect after saving.
    - On first launch you choose Bitcoin Core, standard Knots, or the explicit BIP-110/RDTS Knots option.
    - Core and standard Knots follow established Bitcoin. BIP-110/RDTS can follow a minority chain and requires a separate risk confirmation.
    - RDTS chain data is isolated from the established-chain data. Switching implementations can take a while; avoid restarting or powering off while it migrates.
    - BTC payout addresses support bech32 (`bc1...`) and legacy (`1...` / `3...`). Bitcoin Cash CashAddr (`q...` / `p...`) is not supported.
developer: WillItMod
website: https://github.com/WillItMod/5tratStore-main
repo: https://github.com/WillItMod/5tratStore-main
support: https://discord.gg/vC2UrFAbUF
dependencies: []
port: 21215
icon: "https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-btc/icon.png"
gallery:
  - "https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-btc/icon.png"
  - "https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-btc/images/1.png"
  - "https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-btc/images/2.png"
  - "https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-btc/images/3.png"
  - "https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-btc/images/4.png"
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Adds an explicit optional BIP-110/RDTS Knots node profile with a prominent
  risk warning and required acknowledgement. Bitcoin Core 30.3 and standard
  Knots 29.3 remain established-chain choices. RDTS uses separate chain data,
  preventing it from contaminating the normal Core/Knots chainstate.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "axebtc-app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "BTC sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "pool"
    type: "three-stats"
    refresh: "30s"
    endpoint: "axebtc-app:3000/api/widget/pool"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "1.2"
          subtext: "TH/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
  - data/node-rdts/blocks
  - data/node-rdts/chainstate
  - data/node-rdts/indexes
submitter: WillItMod
