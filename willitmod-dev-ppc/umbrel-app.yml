manifestVersion: 1
id: willitmod-dev-ppc
category: altcoin
name: AxePPC
version: "0.2.38"
tagline: PPC node + solo pool
description: >-
  ALPHA RELEASE (DEV CHANNEL)

  AxePPC is functional and has successfully found blocks, but it is still under
  active development. Expect rough edges, occasional breaking changes, and
  mining/pool behavior that may still need tuning.

  Use this build if you are happy to test, mine, and send helpful feedback.
  For known-good production setups, use stable/main channel apps.

  Run a Peercoin full node and a solo Stratum v1 pool as a single app.


  Miner connection:
    - URL: `stratum+tcp://<your-host-ip>:8765`
    - Username: worker name (optional)
    - Password: anything


  Notes:
    - Use a bare native Peercoin receiving address without a peercoin: prefix. Legacy Base58 P... addresses are recommended; the node validates the address.
    - Stratum will not respond until the node finishes initial sync.
    - ALPHA: expect breaking changes while this is being tested on 5tratumOS.
developer: WillItMod
website: https://github.com/WillItMod/AxePPC
repo: https://github.com/WillItMod/AxePPC
support: https://discord.gg/vC2UrFAbUF
dependencies: []
port: 21220
icon: https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-ppc/icon.png
gallery:
  - https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-ppc/icon.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Payout status now distinguishes node-validated, invalid, missing and not-yet-validated addresses. The channel label is informational. Node-rejected addresses are never saved, and an unavailable node is shown explicitly. Use a bare native Peercoin receiving address without a peercoin: prefix. Existing payout settings, pool configuration and stored data are retained.

  Pins the reviewed payout-validation app and an immutable Peercoin node image. The node retains the same official Peercoin 0.15.1ppc binaries and wrapper, and receives SIGTERM with two minutes for normal database shutdown. Existing chain data, wallets, payouts, pool image, mining configuration and Claude layout are retained.

  Best-share records now retain complete pool-log entries that arrive across
  separate reads. BCH and BCH2 also start their best-share tracker reliably.
  Existing records and direct/MUX hashrate support are retained; node and
  pool images, mining configuration and payouts are unchanged.

  Direct and mixed miners now keep their accepted-share hashrate visible
  when MUX is empty, offline, or routing other miners elsewhere. MUX-only
  headlines require matched worker identities; pool estimates and routed
  telemetry remain separately labelled. Worker cards also retain pool estimates
  when a previously MUX-connected miner reconnects directly. Accepted shares
  and history are unchanged.

  Current miner hash rate from 5tratMux appears separately from accepted-share
  estimates, with stale or unavailable telemetry handled explicitly. Block
  history checks the full block hash against the correct chain and refreshes
  confirmation and reorganisation status before showing a confirmed find.
  Unverified reports remain distinguishable from confirmed pool blocks.

  Block alerts in this browser is a separate local preference. Recent verified
  blocks queue across app tabs, with browser-only Close acknowledgements.
  Reorgs or unavailable proof retract the alert without acknowledging it.
  OS and MUX delivery and acknowledgements remain independently managed.

  Pool block detection follows the Peercoin pool records and verifies the
  Peercoin chain. Future pool containers use an init process for reliable shutdown.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "axeppc-app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "PPC sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "pool"
    type: "three-stats"
    refresh: "30s"
    endpoint: "axeppc-app:3000/api/widget/pool"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "1.2"
          subtext: "TH/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "1.23T"
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
submitter: WillItMod
