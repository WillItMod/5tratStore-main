description: >-
  RELEASE CANDIDATE

  AxeBench is functional and has completed extended DEV-channel fleet testing.
  This MAIN-channel Release Candidate includes the current miner-control,
  benchmarking and offline-device handling improvements.

  AxeBench is a web UI for managing and benchmarking supported miners, with fleet-level views,
  profiles, and automation.

