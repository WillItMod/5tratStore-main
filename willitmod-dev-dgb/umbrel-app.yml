manifestVersion: 1
id: willitmod-dev-dgb
category: altcoin
name: AxeDGB
version: "0.9.181"
tagline: DGB node + solo pool
description: >-
  RC6 RELEASE

  AxeDGB is functional and has successfully found blocks. This update adds
  actual Core RAM and swap measurements, conservative database-cache sizing, and
  a configurable memory guard that shuts Core down cleanly and holds it paused
  until resumed. Setup tools are bundled so installation no longer depends on
  Alpine package mirrors at startup. Core remains at 9.26.5. Version 0.9.181 fixes
  status-cache compatibility with the new Core supervisor image, avoiding
  intermittent dashboard 503 errors during concurrent status requests.

  Verify payout addresses before mining and send helpful feedback if anything
  behaves oddly.

  Run a DigiByte full node (DigiByte Core) and an integrated solo Stratum v1 pool (Miningcore) as a single app.


  Features:
    - Axe-style dashboard for node sync, Stratum status, and pool stats
    - SHA256 + Scrypt Stratum ports in one app install
    - SHA256 difficulty presets (vardiff) for small miners through to high-hashrate rigs
    - Community support via Discord


  Miner connection:
    - Set your solo payout address in the app Settings tab.
    - SHA256 Stratum URL: `stratum+tcp://<your-host-ip>:5678`
    - Scrypt Stratum URL: `stratum+tcp://<your-host-ip>:5679`
    - Username: a worker label (recommended: `rig01.workername`). `walletAddress.workername` also works, but it does not control payout.
    - Password: anything


  Notes:
    - Payout address must be a legacy/base58 DigiByte address (starts with `D`/`S`). `dgb1...` payout is not supported yet.
    - Initial sync can take a long time and a lot of bandwidth/storage (the node downloads and validates the chain).
    - Like most chains, transactions may include arbitrary data; use at your own risk and comply with local laws.
    - Mainnet startup is heavy on RAM and disk. A September 2026 test of the 24-million-block index peaked near 9 GiB of Core RAM with only 128 MiB of database cache. An 8 GiB Core budget did not complete startup. Use a 16 GB or larger host with enough RAM available for Core and the operating system; other node apps may need to be stopped. SSD/NVMe storage is strongly recommended.
    - The memory budget is a soft shutdown guard, not a way to shrink the block index. Low budgets pause Core and require an explicit resume. Allow headroom above the observed Core usage; the requirement can grow with the chain.
    - Solo mining is extremely unlikely to find blocks without significant hashrate.


  Components:
    - DigiByte Core (MIT): https://github.com/digibyte-core/digibyte
    - Miningcore (GPLv3): https://github.com/oliverw/miningcore


  Status:
    - RC6 build: expect minor bugs. Existing mainnet data loaded successfully in testing without a reindex. Core can still spend several minutes on index and oracle-history work, and RPC briefly became unavailable while finishing catch-up. Watch the measured activity and current startup stage before restarting. AxeDGB preserves existing blockchain data.
