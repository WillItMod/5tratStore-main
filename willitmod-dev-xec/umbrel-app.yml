path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Fixes AxeXEC repeatedly restarting on Raspberry Pi and other ARM64 systems
  using non-4K memory pages. The Bitcoin ABC 0.33.4 node is now compiled
  without jemalloc for both AMD64 and ARM64. Existing blockchain data is
  preserved and does not need to be downloaded again.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "axexec-app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "XEC sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "pool"
    type: "three-stats"
    refresh: "30s"
    endpoint: "axexec-app:3000/api/widget/pool"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "1.2"
          subtext: "TH/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
submitter: WillItMod
