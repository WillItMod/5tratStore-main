releaseNotes: >-
  Protect recognized historical PowPow Litecoin and Dogecoin containers from
  their short shutdown grace before normal Umbrel recovery. Both node identities
  must be admitted before one TERM-only graceful stop; unknown, dirty, changed
  or still-pending shutdowns halt recovery for review without force or recipe
  replacement. Already adequate shutdown policies need no preparatory stop.
  Refresh only the bundled PowPow package to the reviewed 930-second SIGTERM
  policy, keeping all other recipe snapshots, UI, authentication and dependencies
  unchanged. App data and private keys stay outside recipe recovery writes.
submitter: WillItMod
backupIgnore:
  - data/backups
