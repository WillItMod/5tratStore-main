manifestVersion: 1
id: willitmod-dev-fumbrel
category: utilities
name: Fumbrel
version: "0.1.3"
tagline: Fuck Up on Umbrel? Recover your apps.
description: >-
  Fumbrel — Fuck Up on Umbrel. For when an OS upgrade leaves your apps having a bad day.

  Scan installed WillItMod apps, repair known Umbrel 1.x/2.0 recipe problems,
  or force-apply the compatible packages bundled with this release. Covers
  AxeBTC, AxeBCH, AxeBCH2, AxeBC2, AxeDGB, AxePPC, AxeXEC, FracAttack,
  PowPow, 5tratSmack, AxeBench, AxeLive, AxeMIG and AxeSim.

  Enter this Umbrel's SSH username and password to begin. Administrator access
  through sudo is required. Credentials stay in memory for the session; Fumbrel
  verifies the host's SSH public key before authenticating. SSH must be enabled.

  Every recovery saves a recipe backup and preserves the installed app ID.
  It does not uninstall apps or delete their data. Starting an updated app may
  run that application's normal data migrations. Recipe restore does not roll
  back application data. Apps stay stopped unless you choose to start them.

  Recovery is limited to recognized WillItMod recipes. It cannot
  fix every failure, CPU instruction crashes, or damaged application data.
  Packages are pinned to this Fumbrel release, not automatically downloaded
  from the latest store. MAIN installations can receive DEV packages while
  keeping their existing IDs; their original store may show an older version.
developer: WillItMod
