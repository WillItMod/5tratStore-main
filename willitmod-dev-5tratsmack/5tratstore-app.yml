manifestVersion: 1
id: willitmod-dev-5tratsmack
category: altcoin
name: 5tratSmack
version: "0.11.13"
tagline: Home-miner 5TRAT node, wallet, solo pool and atomic trade lab
description: >-
  Install and synchronize a complete 5TRAT node, create or restore an encrypted
  wallet, connect home miners to the bundled solo pool, explore the chain, and
  use the atomic trade lab from one 5tratumOS app.

  This MAIN-channel release has completed public-chain, wallet, pool,
  MUX pass-through and trading tests. Back up both the mining wallet and trading
  recovery file before moving funds. The trade book uses the public Komodo DeFi
  Framework network through outbound peer connections; every atomic swap still
  requires the participating wallets to approve and settle it.

  Your Private Activity and My Trades are read only from this installation's
  isolated trading wallet. Global Trades can read completed-swap reports from
  configured public relays for market comparison. 5tratSmack does not publish
  this wallet's orders, trade history, payment identity or swap receipts to
  those relays.

  Miner connection:
    - URL: `stratum+tcp://<your-5tratumos-host-ip>:57557`
    - Username: your 5TRAT address plus an optional worker name
    - Password: anything
developer: WillItMod
website: https://5trat.com
repo: https://github.com/WillItMod/5tratSmack
support: https://github.com/WillItMod/5tratSmack/issues
dependencies: []
port: 21226
icon: https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-5tratsmack/icon.png
gallery:
  - https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-5tratsmack/icon.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Quarterly recovery checks help protect the main and trading wallets: test your
  saved wallet password, read back a saved recovery file, and download a fresh
  backup. Encryption with a separate backup passphrase is recommended and selected
  by default. Optional unencrypted files require an explicit warning because
  anyone with the file can spend the coins; store them securely offline. Both
  recovery formats can restore with a new wallet password. Native .dat backups
  still require their original wallet password. Checks never move funds or replace
  a wallet, and downloading alone does not complete a quarterly check. A seven-day
  reminder option is available. Portable recovery now preserves older private keys,
  full address ranges and indices above 1,000. The cryptography dependency is
  updated to 50.0.1 and backup download tokens are redacted from logs. Existing
  wallet, chain, mining and trading data persist; only the application image changes.
widgets:
  - id: sync
    type: text-with-progress
    refresh: 5s
    endpoint: 5tratsmack-app:3000/api/widget/sync
    link: ""
    example:
      type: text-with-progress
      link: ""
      title: 5TRAT sync
      text: 83%
      progressLabel: In progress
      progress: 0.83
  - id: pool
    type: three-stats
    refresh: 30s
    endpoint: 5tratsmack-app:3000/api/widget/pool
    link: ""
    example:
      type: three-stats
      link: ""
      items:
        - title: Hashrate
          text: "12.4"
          subtext: TH/s
        - title: Workers
          text: "2"
        - title: Best proof
          text: "8.2"
          subtext: M
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
  - data/node/debug.log
submitter: WillItMod
