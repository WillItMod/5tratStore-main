manifestVersion: 1
id: willitmod-dev-5tratsmack
category: altcoin
name: 5tratSmack
version: "0.11.16"
tagline: Home-miner 5TRAT node, wallet, solo pool and atomic trade lab
description: >-
  Install and synchronize a complete 5TRAT node, create or restore an encrypted
  wallet, connect home miners to the bundled solo pool, explore the chain, and
  use the atomic trade lab from one 5tratumOS app.

  5tratSmack includes an experimental atomic trade lab. Back up both the mining
  wallet and trading recovery file before moving funds. The trade book uses the
  public Komodo DeFi Framework network through outbound peer connections; every
  atomic swap still requires the participating wallets to approve and settle it.

  Your Private Activity and My Trades are read only from this installation's
  isolated trading wallet. Global Trades can read completed-swap reports from
  configured public relays for market comparison. 5tratSmack does not publish
  this wallet's orders, trade history, payment identity or swap receipts to
  those relays.

  Miner connection:
    - URL: `stratum+tcp://<your-5tratumos-host-ip>:57557`
    - Username: your 5TRAT address plus an optional worker name
    - Password: anything
developer: WillItMod
website: https://5trat.com
repo: https://github.com/WillItMod/5tratSmack
support: https://github.com/WillItMod/5tratSmack/issues
dependencies: []
port: 21226
icon: https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-5tratsmack/icon.png
gallery:
  - https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-5tratsmack/icon.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Block alerts now require a fresh active-chain proof for the exact 5TRAT block
  and the pool payout in coinbase output zero. Orphaned or unavailable proof
  withdraws an alert while retained Blocks history stays visible. Settings
  includes Block alerts in this browser; its queue and acknowledgements are
  local to that browser. OS and MUX notification acknowledgements remain separate.

  Trade starts with clear Buy and Sell choices and guides one step at a time
  through Amount, Prepare funds, Review and Follow progress. Send and Receive
  have focused forms with expandable Gleec wallet instructions. Trade Pulse
  retains Global Trades, My Trades and Compare, while activity and wallet tools
  have their own pages.

  Offer minimums require an explicit choice. Confirming deposits do not prompt
  duplicate funding, and trade progress stays accessible while a swap waits.
  Native transfers validate the recipient and exact reviewed amount, protect
  open-order funds and recover uncertain broadcasts without signing a second
  payment. Wallet backup and final transaction approval remain required.

  The application and trading backend update together. Existing wallet, chain
  and mining data paths remain unchanged. Package and app versions agree.
widgets:
  - id: sync
    type: text-with-progress
    refresh: 5s
    endpoint: 5tratsmack-app:3000/api/widget/sync
    link: ""
    example:
      type: text-with-progress
      link: ""
      title: 5TRAT sync
      text: 83%
      progressLabel: In progress
      progress: 0.83
  - id: pool
    type: three-stats
    refresh: 30s
    endpoint: 5tratsmack-app:3000/api/widget/pool
    link: ""
    example:
      type: three-stats
      link: ""
      items:
        - title: Hashrate
          text: "12.4"
          subtext: TH/s
        - title: Workers
          text: "2"
        - title: Best proof
          text: "8.2"
          subtext: M
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
  - data/node/debug.log
submitter: WillItMod
