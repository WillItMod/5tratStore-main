manifestVersion: 1
id: willitmod-dev-5tratsmack
category: altcoin
name: 5tratSmack
version: "0.11.23"
tagline: Home-miner 5TRAT node, wallet, solo pool and atomic trade lab
description: >-
  Install and synchronize a complete 5TRAT node, create or restore an encrypted
  wallet, connect home miners to the bundled solo pool, explore the chain, and
  use the experimental atomic trade lab from one 5tratumOS app.

  5tratSmack is experimental DEV software. Back up both the mining wallet and
  trading recovery file before moving funds. The trade book uses the public
  Komodo DeFi Framework network through outbound peer connections; every atomic
  swap still requires the participating wallets to approve and settle it.

  Your Private Activity and My Trades are read only from this installation's
  isolated trading wallet. Global Trades can read completed-swap reports from
  configured public relays for market comparison. 5tratSmack does not publish
  this wallet's orders, trade history, payment identity or swap receipts to
  those relays.

  Miner connection:
    - URL: `stratum+tcp://<your-5tratumos-host-ip>:57557`
    - Username: your 5TRAT address plus an optional worker name
    - Password: anything
developer: WillItMod
website: https://5trat.com
repo: https://github.com/WillItMod/5tratSmack
support: https://github.com/WillItMod/5tratSmack/issues
dependencies: []
port: 21226
icon: https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-5tratsmack/icon.png
gallery:
  - https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-5tratsmack/icon.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Fixes repeating update prompts by comparing the applied store package with the matching MAIN or DEV catalogue. Updates remain authenticated through 5tratumOS, while Umbrel uses its own app manager. The running version and catalogue agree. Existing ports, Claude layouts, node and pool images, wallets and stored data are retained.

  Display a neutral node-address placeholder when the endpoint cannot be inferred
  from the current browser address. Only that one HTML text value changes; the
  existing layout, JavaScript, CSS, compiled backend, node, pool and trading
  components are retained. This package is 0.11.22-dev; the unchanged backend
  continues to report 0.11.21. Existing release notes follow.

  Restores the detailed block-found celebration for automatic alerts on every app tab, including the recorded miner, hit, target, proof tier and scheduled reward. Alerts still require fresh active-chain and pool-payout proof. Closing is remembered only in this browser; unavailable proof withdraws the alert without deleting block history. Missing recorded details remain unknown. Update to 5tratumOS 0.8.25 to keep pool log retention active for this image.

  Fresh, identity-matched mining through MUX remains visible when a miner's hardware API cannot be reached. The card reports unavailable hardware telemetry separately, without marking accepted mining offline or inventing a hardware last-seen time.

  Adds safe pool log retention with 5tratumOS 0.8.23. Complete block and pool accounting records are saved before old raw log bytes are retired. The active log uses a 20 MiB rolling target with two recent archives. Unread or unresolved evidence is retained, and the app reports backlog or blockers. Existing mining, wallet and chain data are preserved.

  Block status stays current during normal MUX polling. Large retained block histories now have a bounded recent feed for MUX, while the complete Blocks history remains visible in the app. Fresh proof of the exact active-chain block and the pool payout in coinbase output zero is still required. Unavailable or orphaned proof withdraws a verified claim without deleting history.

  Direct and mixed miners keep accepted-share hashrate visible when MUX is empty, offline, or routing other miners elsewhere. MUX headlines require matched worker identities; pool estimates and routed telemetry remain separately labelled. Worker cards retain pool estimates when a previously MUX-connected miner reconnects directly.

  Settings includes Block alerts in this browser. Its queue and acknowledgements are local to that browser. OS and MUX notification acknowledgements remain separate.

  Trade guides Buy and Sell through Amount, Prepare funds, Review and Follow progress. Send and Receive use focused forms with expandable Gleec wallet instructions. Trade Pulse retains Global Trades, My Trades and Compare. Native transfers validate the recipient and reviewed amount, protect open-order funds, and recover uncertain broadcasts without signing a second payment. Wallet backup and final transaction approval remain required.

  Existing wallet, chain and mining data paths remain unchanged.

  The tested trading backend image is reused unchanged.
widgets:
  - id: sync
    type: text-with-progress
    refresh: 5s
    endpoint: 5tratsmack-app:3000/api/widget/sync
    link: ""
    example:
      type: text-with-progress
      link: ""
      title: 5TRAT sync
      text: 83%
      progressLabel: In progress
      progress: 0.83
  - id: pool
    type: three-stats
    refresh: 30s
    endpoint: 5tratsmack-app:3000/api/widget/pool
    link: ""
    example:
      type: three-stats
      link: ""
      items:
        - title: Hashrate
          text: "12.4"
          subtext: TH/s
        - title: Workers
          text: "2"
        - title: Best proof
          text: "8.2"
          subtext: M
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
  - data/node/debug.log
submitter: WillItMod
