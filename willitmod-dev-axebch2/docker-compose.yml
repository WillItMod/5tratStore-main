version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: axebch2-app
      APP_PORT: 3000
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  init_permissions:
    image: alpine:3.22.1
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -ec
      - |-
        set -eu
        mkdir -p /data/ui/state /data/node /data/pool/config /data/pool/www/pool /data/pool/www/users
        # Core owns /data/node as bch2:bch2. Changing a running Core's
        # database ownership here prevents writes and can force a restart.
        # The host owns retention leases. Never change their metadata or
        # promote existing bytes into a protected lease. Leave symlinks and
        # multiply-linked files alone; the app still owns its checkpoint/lock.
        find /data/ui /data/pool -name ckpool-retention-capability.json -prune -o \( -type d -o \( -type f -links 1 \) \) -exec chown -h 1000:1000 {} + || true
        find /data/ui /data/pool -name ckpool-retention-capability.json -prune -o \( -type d -o \( -type f -links 1 \) \) -exec chmod ug+rwX {} + || true

  app:
    stop_signal: SIGINT
    hostname: axebch2-app
    image: ghcr.io/willitmod/axebch2-app:0.2.2@sha256:9cb51bc7d9cec105eab1dbbf4c448dc2f757f340d50b08effff5f57c8102729b
    user: "1000:1000"
    group_add:
      - "${AXEBCH2_DOCKER_GID:-1000}"
    restart: unless-stopped
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      bch2:
        condition: service_started
    networks:
      default:
        aliases:
          - axebch2-app
      umbrel_main_network:
        aliases:
          - axebch2-app
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_REVISION: 611287fd9d41656a3fd19651dcb2ce98dbebf5d3
      MUX_IDENTITY_URL: "http://172.17.0.1:21222/api/integrations/workers"
      APP_ID: "willitmod-dev-axebch2"
      APP_VERSION: "0.2.3"
      APP_CHANNEL: "MAIN"
      APP_RELEASE_PHASE: "STABLE"
      APP_SELF_RESTART_ENABLED: "1"
      APP_COMPOSE_PROJECT: "${COMPOSE_PROJECT_NAME}"
      NETWORK_IP: "${NETWORK_IP}"
      BCH2_NODE_IMAGE: "ghcr.io/willitmod/axebch2-node:0.1.34-fresh-entrypoint-dev-20261014@sha256:f90cbc4bc844a773b864c6f33300289a362b6ccd48aa014fd738578a608ca697"
      CKPOOL_IMAGE: "ghcr.io/willitmod/axebch2-ckpool:0.1.34-idle-stop-dev-20261014@sha256:de3dca9f94f73aa9fb46812aa8ef65556e3ffa14b25ef3273bf4523753ea555c"
      BCH2_RPC_HOST: "bch2"
      BCH2_RPC_PORT: "8342"
      BCH2_RPC_USER: "bch2"
      BCH2_RPC_PASS: "${APP_PASSWORD}"
      CKPOOL_STRATUM_HOST: "ckpool"
      CKPOOL_STRATUM_PORT: "3333"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3); assert r.status == 200 and json.load(r).get('ok') is True"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  bch2:
    image: ghcr.io/willitmod/axebch2-node:0.1.34-fresh-entrypoint-dev-20261014@sha256:f90cbc4bc844a773b864c6f33300289a362b6ccd48aa014fd738578a608ca697
    restart: unless-stopped
    stop_grace_period: 15m30s
    depends_on:
      init_permissions:
        condition: service_completed_successfully
    environment:
      NETWORK: "mainnet"
      RPC_USER: "bch2"
      RPC_PASSWORD: "${APP_PASSWORD}"
      RPC_PORT: "8342"
      P2P_PORT: "8339"
      EXTERNAL_IP: "${NETWORK_IP}"
      FORCE_IPV4_BIND: "1"
      PRUNE: "0"
      RPC_THREADS: "4"
      MAX_MEMPOOL: "64"
      DB_CACHE: "256"
      TX_INDEX: "0"
      BOOTSTRAP_CONNECTNODES: ""
      PEER_WATCHDOG_INTERVAL: "30"
      PEER_WATCHDOG_MIN_CONNECTIONS: "1"
      ONE_TIME_FULL_RESYNC_KEY: "bitcoincashii-shadow-chain-20260413"
      ONE_TIME_FULL_RESYNC_REQUIRE_EXISTING_DATA: "1"
      ONE_TIME_REINDEX_KEY: "bitcoincashii-v27.0.2"
      ONE_TIME_REINDEX_REQUIRE_EXISTING_DATA: "1"
    volumes:
      - ${APP_DATA_DIR}/data/node:/data/node
    ports:
      - "8339:8339/tcp"
    healthcheck:
      test:
        - CMD-SHELL
        - bitcoincashII-cli -datadir=/data/node -rpcuser="$$RPC_USER" -rpcpassword="$$RPC_PASSWORD" getblockchaininfo >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 2m

  ckpool:
    image: ghcr.io/willitmod/axebch2-ckpool:0.1.34-idle-stop-dev-20261014@sha256:de3dca9f94f73aa9fb46812aa8ef65556e3ffa14b25ef3273bf4523753ea555c
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      bch2:
        condition: service_started
    environment:
      BCH2_RPC_HOST: "bch2"
      BCH2_RPC_PORT: "8342"
      BCH2_RPC_USER: "bch2"
      BCH2_RPC_PASSWORD: "${APP_PASSWORD}"
      BCH2_ZMQ_HASHBLOCK_PORT: "28342"
      PAYOUT_ADDRESS: "CHANGEME_BCH_PAYOUT_ADDRESS"
      MINDIFF: "1"
      STARTDIFF: "16"
      MAXDIFF: "0"
    user: "1000:1000"
    command: ["-k", "-L", "-c", "/data/pool/config/ckpool.conf"]
    ports:
      - "9265:3333/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/pool:/data/pool
    healthcheck:
      test:
        - CMD-SHELL
        - 'pid=$$(cat /tmp/ckpool/main.pid 2>/dev/null || true); [ -n "$$pid" ] && kill -0 "$$pid" 2>/dev/null'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network

# 5tratumOS 0.8.36 verifies these exact retention bindings before any app update.
# Umbrel ignores this Compose extension.
x-5tratumos-stop-policy:
  version: 2
  services: {}
  requiresRetention:
    appId: axebch2
    appService: app
    appSourceRevision: 611287fd9d41656a3fd19651dcb2ce98dbebf5d3
    appImage: ghcr.io/willitmod/axebch2-app:0.2.2@sha256:9cb51bc7d9cec105eab1dbbf4c448dc2f757f340d50b08effff5f57c8102729b
    platforms:
      amd64:
        appConfigDigest: sha256:86f8b9191f480c45393a0c32b7aa97256261a5172539383c7a58b11d3aaa1083
        appManifestDigest: sha256:c20ba7778a1c219e9761e21e429eba9f802791161103729a20103370e8d03746
      arm64:
        appConfigDigest: sha256:d39d31fe67145711781e3f97386a1e0eacde605105d4dca6748daeb88045a24a
        appManifestDigest: sha256:a1cec1665cb11e33826363eac07055e7029dec903a7395d9c5399d33cea8af57
