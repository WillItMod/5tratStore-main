manifestVersion: 1
id: willitmod-dev-axebch2
category: altcoin
name: "AxeBCH2"
version: "0.2.0.3"
tagline: BCH2 node + solo pool
description: >-
  RC1 RELEASE

  AxeBCH2 is functional, has successfully found blocks, and has completed
  extended DEV-channel node and solo-pool testing. Verify payout settings and
  report unexpected behaviour.

  Miner connection:
    - URL: `stratum+tcp://<your-5tratumos-host-ip>:9265`
    - Username: worker name or `wallet.workername`
    - Password: anything

developer: WillItMod
website: https://github.com/WillItMod/AxeBCH2
repo: https://github.com/WillItMod/AxeBCH2
support: https://discord.gg/vC2UrFAbUF
dependencies: []
port: 21223
icon: https://raw.githubusercontent.com/WillItMod/umbrel-community-store/main/willitmod-dev-axebch2/icon.png
gallery:
  - https://raw.githubusercontent.com/WillItMod/umbrel-community-store/main/willitmod-dev-axebch2/images/1.png
  - https://raw.githubusercontent.com/WillItMod/umbrel-community-store/main/willitmod-dev-axebch2/images/2.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Corrects stale version metadata from 0.2.0.2 so the store, image, app UI, API
  and support check-in now consistently report 0.2.0.3. Includes the worker
  identity compatibility fix from the previous release.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "axebch2-app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "BCH2 sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "pool"
    type: "three-stats"
    refresh: "30s"
    endpoint: "axebch2-app:3000/api/widget/pool"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "1.2"
          subtext: "TH/s"
        - title: "Workers"
          text: "2"
        - title: "Best share"
          text: "21"
          subtext: "G"
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
submitter: WillItMod
