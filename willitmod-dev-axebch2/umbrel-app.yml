releaseNotes: >-
  Application health checks now respond without waiting for the node RPC. Slow or unavailable nodes remain visible in the detailed status APIs. Timed-out clients no longer produce broken-pipe tracebacks. Existing ports, node and pool images, mining configuration, payouts and stored data are retained. On 5tratumOS, update the OS to 0.8.36 before updating this app. OS 0.8.34 and 0.8.35 refuse this app update before pulling images, stopping apps or replacing the live Compose definition. Users on earlier OS versions must upgrade the OS first. Umbrel does not require this OS update.

  Standardizes the app version to 0.2.1. The running interface and catalogue use the same version. Existing ports, images, mining configuration and stored data are retained.

  Pool restarts stop cleanly while waiting for a payout address. On Umbrel, the app now uses the existing Docker socket group to verify that saved settings reached the restarted node or pool. The app interface, node image, pool binary, payout settings and stored chain data are retained.

  Fresh installations using this node image retain their synced chain on later normal restarts. The recipe pins a reviewed entrypoint-only node image over the tested node binaries and libraries. App and pool images, wallets, payouts and configuration are retained. The existing required one-time resync/reindex policy remains active for unmarked legacy chain data.

  Settings restart status now remains pending until the required backend services provide fresh readiness evidence. Overlapping saves keep the latest pending state. The pool uses portable SHA256 with native amd64 and arm64 images. Existing node data, wallets, pool configuration, accounting history and the app SIGINT stop policy are retained.

  Adds safe pool log retention with 5tratumOS 0.8.23. Complete block and pool accounting records are saved before old raw log bytes are retired. The active log uses a 20 MiB rolling target with two recent archives. Unread or unresolved evidence is retained, and the app reports backlog or blockers. Existing mining, wallet and chain data are preserved.

  Best-share records now retain complete pool-log entries that arrive across
  separate reads. BCH and BCH2 also start their best-share tracker reliably.
  Existing records and direct/MUX hashrate support are retained; node and
  pool images, mining configuration and payouts are unchanged.

  Direct and mixed miners now keep their accepted-share hashrate visible
  when MUX is empty, offline, or routing other miners elsewhere. MUX-only
  headlines require matched worker identities; pool estimates and routed
  telemetry remain separately labelled. Worker cards also retain pool estimates
  when a previously MUX-connected miner reconnects directly. Accepted shares
  and history are unchanged.

  Current miner hash rate from 5tratMux appears separately from accepted-share
  estimates, with stale or unavailable telemetry handled explicitly. Block
  history checks the full block hash against the correct chain and refreshes
  confirmation and reorganisation status before showing a confirmed find.
  Unverified reports remain distinguishable from confirmed pool blocks.

  Block alerts in this browser is a separate local preference. Recent verified
  blocks queue across app tabs, with browser-only Close acknowledgements.
  Reorgs or unavailable proof retract the alert without acknowledging it.
  OS and MUX delivery and acknowledgements remain independently managed.

  Settings saves preserve existing file ownership and report permission errors accurately.
  Existing Core data ownership and mining configuration are retained.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "axebch2-app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "BCH2 sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "pool"
    type: "three-stats"
    refresh: "30s"
    endpoint: "axebch2-app:3000/api/widget/pool"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "1.2"
          subtext: "TH/s"
        - title: "Workers"
          text: "2"
        - title: "Best share"
          text: "21"
          subtext: "G"
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
submitter: WillItMod
