manifestVersion: 1
id: willitmod-dev-axebch2
category: altcoin
name: "AxeBCH2"
version: "0.2.2"
tagline: BCH2 node + solo pool (alpha)
description: >-
  ALPHA RELEASE (DEV CHANNEL)

  AxeBCH2 is functional and has successfully found blocks, but it is still
  under active development. Expect rough edges, occasional breaking changes,
  and mining/pool behavior that may still need tuning.

  Use this build if you are happy to test, mine, and send helpful feedback.
  For known-good production setups, use stable/main channel apps.

  Miner connection:
    - URL: `stratum+tcp://<your-5tratumos-host-ip>:9265`
    - Username: worker name or `wallet.workername`
    - Password: anything

developer: WillItMod
website: https://github.com/WillItMod/AxeBCH2
