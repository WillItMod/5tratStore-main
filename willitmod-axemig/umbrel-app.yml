id: willitmod-axemig
category: bitcoin
name: AxeMIG
version: "0.1.24"
tagline: Data-only blockchain migration tool
description: >-
  ALPHA RELEASE (DEV CHANNEL)

  AxeMIG is functional, but it moves/copies blockchain data and should be used
  deliberately. Stop affected apps first, verify the source and target, and keep
  a backup path for important data.

  AxeMIG helps you move or copy chain data (blocks/chainstate and optional peers/indexes) between supported node apps.
  It does not migrate configs, secrets, cookies, or wallets.


  Typical workflow:
    - Install the target node app (AxeBTC / AxeBCH / AxeDGB / etc) and start it until it shows Synchronising (IBD started), then stop it.
    - Stop the source node app (compatible Bitcoin, Knots, or similar app).
    - Run AxeMIG migration, then start the target node app and verify.


  If something goes wrong, use AxeMIG Undo to restore the target's previous state.
