releaseNotes: >-
  v0.1.24-dev: Waits for verified graceful node shutdown before copy or restore. A timeout or cancellation prevents file changes and automatic restarts. Layouts, chain selectors and migration data exclusions are unchanged.

  v0.1.23-dev: Keeps USB host paths usable and excludes independent BC2, BCH2,
  eCash and Peercoin chains from Bitcoin/BCH selectors. Restores stopped FracAttack
  discovery. Migration scripts, settings and layouts are unchanged.

  v0.1.22-dev: USB discovery and exported folders now retain their host paths, so selected drives can be used by export/import. The UI and existing migration exclusions are unchanged.

  v0.1.21-dev.1 (recipe revision): Route the Umbrel proxy to this app's unique container so other utilities cannot intercept its requests.

  v0.1.21-dev: Replaces legacy Fractal wording in migration guidance with AxeBTC.

  v0.1.20-dev: Relaxes the in-app maturity label to ALPHA while keeping migration safety guidance clear.

  v0.1.19-dev: Fixes helper payload passing for endpoint/USB discovery and returns JSON 404 for unknown API routes so utility-app probes do not receive the HTML app shell as a false success.
