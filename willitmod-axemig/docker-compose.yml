version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: server
      APP_PORT: 12150

  server:
    image: ghcr.io/willitmod/axemig:0.1.24-dev@sha256:e20d2d002567980e24000263464576d06a7afd0f35f477b7d77374f4ee2774f3
    restart: on-failure
    stop_grace_period: 30s
    init: true
    environment:
      AXEMIG_HOME: /data
      APP_VERSION: "0.1.24"
      AXEMIG_PORT: 12150
      AXEMIG_HOST: 0.0.0.0
      AXEMIG_HELPER_IMAGE: ghcr.io/willitmod/axemig:0.1.24-dev@sha256:e20d2d002567980e24000263464576d06a7afd0f35f477b7d77374f4ee2774f3
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
