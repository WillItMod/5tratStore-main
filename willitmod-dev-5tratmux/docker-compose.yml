{
  "version": "3.7",
  "services": {
    "app_proxy": {
      "environment": {
        "APP_HOST": "willitmod-dev-5tratmux_server_1",
        "APP_PORT": "21222"
      }
    },
    "server": {
      "image": "ghcr.io/willitmod/5tratmux-app:0.9.87-umbrel@sha256:fff062362d914279dbbb209b2e9c74ac8e1b2f12066946038f15b83b9328c5a0",
      "user": "1000:1000",
      "init": true,
      "restart": "unless-stopped",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 256,
      "mem_limit": "1536m",
      "stop_grace_period": "30s",
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,exec,size=256m,mode=1777"
      ],
      "ports": [
        "7331:7331/tcp"
      ],
      "expose": [
        "21222"
      ],
      "volumes": [
        "${APP_DATA_DIR}/data/state:/data/state",
        "${APP_DATA_DIR}/data/local-ai-control:/run/5tratmux-local-ai:ro"
      ],
      "environment": {
        "MUX_PLATFORM": "umbrel",
        "APP_HOST": "0.0.0.0",
        "APP_PORT": "21222",
        "STATE_DIR": "/data/state",
        "MUX_OPERATOR_PASSWORD": "${APP_PASSWORD}",
        "MUX_AUTH_TRUSTED_PROXIES": "${GATEWAY_IP}",
        "MUX_HTTP_STRICT_HOST": "1",
        "MUX_HTTP_ALLOWED_HOSTS": "${DEVICE_DOMAIN_NAME},${DEVICE_HOSTNAME},localhost",
        "APP_VERSION": "0.9.87",
        "APP_CHANNEL": "MAIN",
        "LOCAL_AI_SUPERVISOR_SOCKET": "/run/5tratmux-local-ai/control.sock"
      }
    },
    "local_ai": {
      "image": "ghcr.io/willitmod/5tratmux-app:local-ai-0.1.11-umbrel@sha256:1d43ac1c696733f4d2eb3097b4c8ea501091be0489921ebf53a44fffe333314f",
      "user": "1000:1000",
      "init": true,
      "restart": "unless-stopped",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 128,
      "mem_limit": "6g",
      "memswap_limit": "6g",
      "cpus": 2,
      "stop_grace_period": "45s",
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,exec,size=512m,mode=1777"
      ],
      "volumes": [
        "${APP_DATA_DIR}/data/local-ai-control:/run/5tratmux-local-ai",
        "${APP_DATA_DIR}/data/local-ai:/data/local-ai"
      ]
    }
  }
}
