manifestVersion: 1
id: willitmod-dev-bc2
category: bitcoin
name: AxeBC2
version: "0.1.11"
tagline: BC2 node + solo pool
description: >-
  STABLE RELEASE (MAIN CHANNEL)

  AxeBC2 runs a BitcoinII node and private solo-mining pool. This Core 31
  release supports the ShockWave consensus activation.

  Run a BitcoinII (BC2) full node and an integrated solo Stratum v1 pool (ckpool) as a single app.


  Miner connection:
    - URL: `stratum+tcp://<node-ip>:2345`
    - Username: worker name (optional)
    - Password: anything


  Notes:
    - Set your payout address in the app Settings tab.
    - Requires 5tratumOS 0.7.12 or newer.
    - The node makes outbound peer connections; this app does not publish a public P2P port or request NAT-PMP mappings.
    - Initial sync can take a long time and a lot of bandwidth/storage (the node downloads and validates the chain).
    - Solo mining is extremely unlikely to find blocks without significant hashrate.


  Components:
    - BitcoinII Core: https://github.com/Bitcoin-II/BitcoinII-Core
    - ckpool: https://github.com/ckolivas/ckpool
developer: WillItMod
website: https://github.com/WillItMod/AxeBC2
repo: https://github.com/WillItMod/AxeBC2
support: https://discord.gg/vC2UrFAbUF
dependencies: []
port: 21219
icon: https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-bc2/icon.png
gallery:
  - https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-bc2/icon.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Corrects payout-address validation: BitcoinII Core-accepted mainnet addresses
  beginning with 1, 3, or bc1 are supported, while invalid or wrong-network
  addresses are rejected without changing the saved pool configuration. Settings
  are also left untouched while Core is unavailable, and payout checks left
  pending by an older release are retried at a bounded interval. It removes the
  misleading payout warning from MAIN builds, keeps CKPool /config writable on
  every initializer run, and conditionally repairs /www ownership when needed so
  existing sharelogs remain writable. This app-only update retains the accepted
  BitcoinII Core 31.1 image, existing blockchain and pool data, and the configured
  payout address; it does not trigger another blockchain reindex. Requires
  5tratumOS 0.7.12 or newer.
  Stratum remains on TCP port 2345, telemetry remains disabled by default, and
  no public P2P port or NAT-PMP mapping is enabled.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "axebc2-app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "BC2 sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "pool"
    type: "three-stats"
    refresh: "30s"
    endpoint: "axebc2-app:3000/api/widget/pool"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "1.2"
          subtext: "TH/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
submitter: WillItMod
