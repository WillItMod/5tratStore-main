manifestVersion: 1
id: willitmod-dev-bc2
category: bitcoin
name: AxeBC2
version: "0.1.22"
tagline: BC2 node + solo pool
description: >-
  BETA RELEASE (DEV CHANNEL)

  AxeBC2 is a functional BitcoinII node and solo pool that has successfully
  found blocks. This BETA build includes the latest fixes and refinements.

  Run a BitcoinII (BC2) full node and an integrated solo Stratum v1 pool (ckpool) as a single app.


  Miner connection:
    - URL: `stratum+tcp://<node-ip>:2345`
    - Username: worker name (optional)
    - Password: anything


  Notes:
    - Set your payout address in the app Settings tab.
    - Supports Umbrel; on 5tratumOS, version 0.7.12 or newer is required.
    - The node makes outbound peer connections; this app does not publish a public P2P port or request NAT-PMP mappings.
    - Initial sync can take a long time and a lot of bandwidth/storage (the node downloads and validates the chain).
    - Solo mining is extremely unlikely to find blocks without significant hashrate.


  Components:
    - BitcoinII Core: https://github.com/Bitcoin-II/BitcoinII-Core
    - ckpool: https://github.com/ckolivas/ckpool
developer: WillItMod
website: https://github.com/WillItMod/AxeBC2
repo: https://github.com/WillItMod/AxeBC2
support: https://discord.gg/vC2UrFAbUF
dependencies: []
port: 21219
icon: https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-bc2/icon.png
gallery:
  - https://raw.githubusercontent.com/WillItMod/5tratStore-main/main/willitmod-dev-bc2/icon.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Fresh installations retain their Core31 chain across ordinary restarts. Existing chain data still follows the required migration, checkpoint and rollback checks. Application, node and pool images are unchanged.

  Adds safe pool log retention with 5tratumOS 0.8.23. Complete block and pool accounting records are saved before old raw log bytes are retired. The active log uses a 20 MiB rolling target with two recent archives. Unread or unresolved evidence is retained, and the app reports backlog or blockers. Existing mining, wallet and chain data are preserved.

  Best-share records now use verified payout/worker identities and supported
  worker aliases. Fixes record/cache resets. Incomplete pool-log entries
  are retained until complete. Existing unqualified records remain
  pool-wide only; verified personal records start with fresh shares
  after this update. The card explains partial history until the next
  block or global record reset. Direct/MUX hashrate support, node and
  pool images, mining configuration and payouts are unchanged.

  Direct and mixed miners now keep their accepted-share hashrate visible
  when MUX is empty, offline, or routing other miners elsewhere. MUX-only
  headlines require matched worker identities; pool estimates and routed
  telemetry remain separately labelled. Worker cards also retain pool estimates
  when a previously MUX-connected miner reconnects directly. Accepted shares
  and history are unchanged.

  Current miner hash rate from 5tratMux appears separately from accepted-share
  estimates, with stale or unavailable telemetry handled explicitly. Block
  history checks the full block hash against the correct chain and refreshes
  confirmation and reorganisation status before showing a confirmed find.
  Unverified reports remain distinguishable from confirmed pool blocks.

  Block alerts in this browser is a separate local preference. Recent verified
  blocks queue across app tabs, with browser-only Close acknowledgements.
  Reorgs or unavailable proof retract the alert without acknowledging it.
  OS and MUX delivery and acknowledgements remain independently managed.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "axebc2-app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "BC2 sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "pool"
    type: "three-stats"
    refresh: "30s"
    endpoint: "axebc2-app:3000/api/widget/pool"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "1.2"
          subtext: "TH/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
submitter: WillItMod
