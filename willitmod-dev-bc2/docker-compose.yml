version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: axebc2-app
      APP_PORT: 3000
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  init:
    # File configs are read-only bind mounts; Docker rejects missing sources.
    configs:
      - source: axebc2_build_metadata
        target: /etc/5tratumos/build.json
      - source: axebc2_init
        target: /opt/axebc2/init.sh
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    volumes:
      - "axebc2_data:/data:nocopy"
      - "axebc2_appdata:/appdata:nocopy"
      - "axebc2_templates:/data/templates:nocopy"
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      APPS_SUBNET: "${NETWORK_IP}/16"
      RPC_USER: "btc2"
      RPC_PASSWORD: "${APP_PASSWORD}"
      BTC2_RPC_PORT: "8337"
      BTC2_P2P_PORT: "8338"
      BTC2_ZMQ_HASHBLOCK_PORT: "28336"
      PAYOUT_ADDRESS: "CHANGEME_BTC2_PAYOUT_ADDRESS"
    command:
      - /bin/sh
      - -ec
      - |-
        # 5tratumOS preserves an installed app's data directory during an
        # update, including its previously seeded init script. Keep this
        # upgrade repair in the versioned Compose command so 0.1.10 installs
        # receive it even when /data/init/init.sh is intentionally retained.
        mkdir -p /data/pool/config /data/pool/www/pool /data/pool/www/users
        # Keep the small mutable config directory writable by the unprivileged
        # app. This is required on fresh installs as well as preserved upgrades.
        chown -R 1000:1000 /data/pool/config ||
          { echo >&2 "cannot assign CKPool config data to uid/gid 1000"; exit 1; }
        if [ "$$(stat -c '%u:%g' /data/pool/www 2>/dev/null || true)" != "1000:1000" ] ||
           [ "$$(stat -c '%u:%g' /data/pool/www/pool 2>/dev/null || true)" != "1000:1000" ] ||
           [ "$$(stat -c '%u:%g' /data/pool/www/users 2>/dev/null || true)" != "1000:1000" ]; then
          chown -R 1000:1000 /data/pool/www ||
            { echo >&2 "cannot assign CKPool sharelog data to uid/gid 1000"; exit 1; }
        fi
        exec /bin/sh /opt/axebc2/init.sh

  btc2d:
    image: ghcr.io/willitmod/bitcoinii-core:31.1.0@sha256:8875917ece57668fe9925d40a256ce8d429a3071511bb555d4ace1fa4370afc6
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 15m30s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - "axebc2_node:/data:nocopy"

  ckpool:
    image: ghcr.io/willitmod/docker-ckpool-solo:590fb2a@sha256:8a9a7f10c8138d0f55533132ee7710a06715a42a49f75efb39be3350ada4fa6e
    user: "1000:1000"
    restart: on-failure
    depends_on:
      - btc2d
      - init
    stop_grace_period: 30s
    init: true
    ports:
      - "2345:3333/tcp"
    volumes:
      - "axebc2_pool_config:/config:ro,nocopy"
      - "axebc2_pool_www:/www:nocopy"
    entrypoint:
      - /bin/sh
      - -ec
      - |-
        set -eu
        rm -f /tmp/ckpool/*.pid 2>/dev/null || true
        ARGS="$(cat /config/ckpool.args 2>/dev/null || true)"
        if command -v ckpool >/dev/null 2>&1; then
          exec ckpool -k -L -c /config/ckpool.conf $$ARGS
        elif [ -x /bin/ckpool ]; then
          exec /bin/ckpool -k -L -c /config/ckpool.conf $$ARGS
        elif [ -x /usr/bin/ckpool ]; then
          exec /usr/bin/ckpool -k -L -c /config/ckpool.conf $$ARGS
        else
          echo "ckpool binary not found in image"
          exit 127
        fi

  app:
    image: ghcr.io/willitmod/axebc2-app-umbrel-dev:0.1.18-mux.8164f42cc1ab@sha256:df461e0c507d8d863256d96d8653c9f49585a39aed6f83e8ad3976c6c42fea4d
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      - btc2d
      - ckpool
      - init
    networks:
      default:
        aliases:
          - axebc2-app
      umbrel_main_network:
        aliases:
          - axebc2-app
    volumes:
      - "axebc2_data:/data:nocopy"
    environment:
      MUX_IDENTITY_URL: "http://172.17.0.1:21222/api/integrations/workers"
      NETWORK_IP: "${NETWORK_IP}"
      STATIC_DIR: "/app/static"
      APP_CHANNEL: "MAIN"
      APP_VERSION_SUFFIX: ""
      BTC2D_IMAGE: "ghcr.io/willitmod/bitcoinii-core:31.1.0@sha256:8875917ece57668fe9925d40a256ce8d429a3071511bb555d4ace1fa4370afc6"
      CKPOOL_IMAGE: "ghcr.io/willitmod/docker-ckpool-solo:590fb2a@sha256:8a9a7f10c8138d0f55533132ee7710a06715a42a49f75efb39be3350ada4fa6e"
      SUPPORT_CHECKIN_ENABLED: "false"
      BTC2_RPC_HOST: "btc2d"
      BTC2_RPC_PORT: "8337"
      BTC2_RPC_USER: "btc2"
      BTC2_RPC_PASS: "${APP_PASSWORD}"
      CKPOOL_STATUS_DIR: "/data/pool/www/pool"
      CKPOOL_USERS_DIR: "/data/pool/www/users"
      CKPOOL_LOG_PATH: "/data/pool/www/ckpool.log"
      CKPOOL_CONF_PATH: "/data/pool/config/ckpool.conf"

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network

# Umbrel 1.7.4 patches service.volumes as strings before rendering templates.
# Local bind volumes preserve exact host paths and fail if a directory is absent.
# nocopy prevents Docker from seeding image contents into these persistent paths.
volumes:
  axebc2_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${APP_DATA_DIR}/data
  axebc2_appdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${APP_DATA_DIR}
  axebc2_templates:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${APP_DATA_DIR}/data/templates
  axebc2_node:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${APP_DATA_DIR}/data/node
  axebc2_pool_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${APP_DATA_DIR}/data/pool/config
  axebc2_pool_www:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${APP_DATA_DIR}/data/pool/www

configs:
  axebc2_build_metadata:
    file: /etc/5tratumos/build.json
  axebc2_init:
    file: ${APP_DATA_DIR}/data/init/init.sh
