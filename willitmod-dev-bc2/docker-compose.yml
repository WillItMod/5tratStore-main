version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: axebc2-app
      APP_PORT: 3000
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    volumes:
      - type: bind
        source: /etc/5tratumos/build.json
        target: /etc/5tratumos/build.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_DATA_DIR}/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_DATA_DIR}
        target: /appdata
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_DATA_DIR}/data/templates
        target: /data/templates
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_DATA_DIR}/data/init/init.sh
        target: /opt/axebc2/init.sh
        read_only: true
        bind:
          create_host_path: false
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      APPS_SUBNET: "${NETWORK_IP}/16"
      RPC_USER: "btc2"
      RPC_PASSWORD: "${APP_PASSWORD}"
      BTC2_RPC_PORT: "8337"
      BTC2_P2P_PORT: "8338"
      BTC2_ZMQ_HASHBLOCK_PORT: "28336"
      PAYOUT_ADDRESS: "CHANGEME_BTC2_PAYOUT_ADDRESS"
    command:
      - /bin/sh
      - -ec
      - exec /bin/sh /opt/axebc2/init.sh

  btc2d:
    image: ghcr.io/willitmod/bitcoinii-core:31.1.0-dev@sha256:CORE31_CANDIDATE_DIGEST_REQUIRED
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 15m30s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/data/node
        target: /data
        bind:
          create_host_path: false

  ckpool:
    image: ghcr.io/willitmod/docker-ckpool-solo:590fb2a@sha256:8a9a7f10c8138d0f55533132ee7710a06715a42a49f75efb39be3350ada4fa6e
    user: "1000:1000"
    restart: on-failure
    depends_on:
      - btc2d
      - init
    stop_grace_period: 30s
    init: true
    ports:
      - "2345:3333/tcp"
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/data/pool/config
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_DATA_DIR}/data/pool/www
        target: /www
        bind:
          create_host_path: false
    entrypoint:
      - /bin/sh
      - -ec
      - |-
        set -eu
        rm -f /tmp/ckpool/*.pid 2>/dev/null || true
        ARGS="$(cat /config/ckpool.args 2>/dev/null || true)"
        if command -v ckpool >/dev/null 2>&1; then
          exec ckpool -k -L -c /config/ckpool.conf $$ARGS
        elif [ -x /bin/ckpool ]; then
          exec /bin/ckpool -k -L -c /config/ckpool.conf $$ARGS
        elif [ -x /usr/bin/ckpool ]; then
          exec /usr/bin/ckpool -k -L -c /config/ckpool.conf $$ARGS
        else
          echo "ckpool binary not found in image"
          exit 127
        fi

  app:
    image: ghcr.io/willitmod/axebc2-app-umbrel-dev:0.1.10-dev@sha256:APP_CANDIDATE_DIGEST_REQUIRED
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      - btc2d
      - ckpool
      - init
    networks:
      default:
        aliases:
          - axebc2-app
      umbrel_main_network:
        aliases:
          - axebc2-app
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/data
        target: /data
        bind:
          create_host_path: false
    environment:
      NETWORK_IP: "${NETWORK_IP}"
      STATIC_DIR: "/app/static"
      APP_CHANNEL: "ALPHA"
      APP_VERSION_SUFFIX: "-dev"
      BTC2D_IMAGE: "ghcr.io/willitmod/bitcoinii-core:31.1.0-dev@sha256:CORE31_CANDIDATE_DIGEST_REQUIRED"
      CKPOOL_IMAGE: "ghcr.io/willitmod/docker-ckpool-solo:590fb2a@sha256:8a9a7f10c8138d0f55533132ee7710a06715a42a49f75efb39be3350ada4fa6e"
      SUPPORT_CHECKIN_ENABLED: "false"
      BTC2_RPC_HOST: "btc2d"
      BTC2_RPC_PORT: "8337"
      BTC2_RPC_USER: "btc2"
      BTC2_RPC_PASS: "${APP_PASSWORD}"
      CKPOOL_STATUS_DIR: "/data/pool/www/pool"
      CKPOOL_USERS_DIR: "/data/pool/www/users"
      CKPOOL_LOG_PATH: "/data/pool/www/ckpool.log"
      CKPOOL_CONF_PATH: "/data/pool/config/ckpool.conf"

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
