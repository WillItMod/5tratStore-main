name: Validate application versions and published ports

on:
  pull_request:
    paths:
      - "willitmod-*/umbrel-app.yml"
      - "willitmod-*/global-app.yml"
      - "willitmod-*/5tratstore-app.yml"
      - "willitmod-*/docker-compose.yml"
      - "APP-VERSION-NORMALIZATION-2026-10-15.json"
      - "tests/app_version_normalization.py"
      - "tests/test_app_version_normalization.py"
      - ".github/workflows/validate-app-versions.yml"
  push:
    branches: [main]
    paths:
      - "willitmod-*/**"
      - "APP-VERSION-NORMALIZATION-2026-10-15.json"
      - "tests/app_version_normalization.py"
      - "tests/test_app_version_normalization.py"
      - ".github/workflows/validate-app-versions.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -p test_app_version_normalization.py -v
