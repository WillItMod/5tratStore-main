name: Validate protected AxeDGB MAIN app successor
on:
  pull_request:
    paths:
      - "willitmod-dev-dgb/**"
      - "DGB-UMBREL-AUTH-RELEASE-2026-10-16.json"
      - "release-records/dgb-0.9.182-umbrel-authfix-delivery.json"
      - "scripts/dgb_umbrel_release.py"
      - "tests/test_dgb_umbrel_release.py"
      - "tests/test_axedgb_memory_package.py"
      - ".github/workflows/validate-dgb-umbrel-release.yml"
  push:
    branches: [main]
    paths:
      - "willitmod-dev-dgb/**"
      - "DGB-UMBREL-AUTH-RELEASE-2026-10-16.json"
      - "release-records/dgb-0.9.182-umbrel-authfix-delivery.json"
      - "scripts/dgb_umbrel_release.py"
      - "tests/test_dgb_umbrel_release.py"
      - "tests/test_axedgb_memory_package.py"
      - ".github/workflows/validate-dgb-umbrel-release.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/dgb_umbrel_release.py
      - run: python3 -m unittest discover -s tests -p test_dgb_umbrel_release.py -v
