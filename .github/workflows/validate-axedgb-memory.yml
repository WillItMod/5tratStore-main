name: Validate AxeDGB memory packaging
on:
  pull_request:
    paths: ["willitmod-dev-dgb/**", "tests/test_axedgb_memory_package.py", "scripts/dgb_umbrel_release.py", "DGB-UMBREL-AUTH-RELEASE-2026-10-16.json", ".github/workflows/validate-axedgb-memory.yml"]
  push:
    paths: ["willitmod-dev-dgb/**", "tests/test_axedgb_memory_package.py", "scripts/dgb_umbrel_release.py", "DGB-UMBREL-AUTH-RELEASE-2026-10-16.json", ".github/workflows/validate-axedgb-memory.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s tests -p test_axedgb_memory_package.py -v
