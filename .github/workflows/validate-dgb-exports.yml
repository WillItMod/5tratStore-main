name: Validate AxeDGB Umbrel auth exports

on:
  pull_request:
    paths:
      - "willitmod-dev-dgb/exports.sh"
      - "tests/test_dgb_exports.py"
      - ".github/workflows/validate-dgb-exports.yml"
  push:
    branches: [main]
    paths:
      - "willitmod-dev-dgb/exports.sh"
      - "tests/test_dgb_exports.py"
      - ".github/workflows/validate-dgb-exports.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: bash -n willitmod-dev-dgb/exports.sh
      - run: python3 -m unittest discover -s tests -p test_dgb_exports.py -v
