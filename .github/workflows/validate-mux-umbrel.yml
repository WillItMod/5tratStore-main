name: Validate protected Umbrel 5tratMux release

on:
  pull_request:
    paths:
      - "willitmod-dev-5tratmux/**"
      - "MUX-UMBREL-*.json"
      - "release-records/**"
      - "scripts/mux_umbrel_release.py"
      - "scripts/mux_local_ai_umbrel*.py"
      - "scripts/mux-local-ai/**"
      - "tests/test_mux_umbrel_release.py"
      - "tests/test_mux_local_ai_umbrel_release.py"
      - "tests/test_mux_local_ai_umbrel_ui_release.py"
      - "tests/fixtures/**"
      - ".github/workflows/validate-mux-umbrel.yml"
  push:
    branches: [main]
    paths:
      - "willitmod-dev-5tratmux/**"
      - "MUX-UMBREL-*.json"
      - "release-records/**"
      - "scripts/mux_umbrel_release.py"
      - "scripts/mux_local_ai_umbrel*.py"
      - "scripts/mux-local-ai/**"
      - "tests/test_mux_umbrel_release.py"
      - "tests/test_mux_local_ai_umbrel_release.py"
      - "tests/test_mux_local_ai_umbrel_ui_release.py"
      - "tests/fixtures/**"
      - ".github/workflows/validate-mux-umbrel.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Require exact public images, source protection and native qualification
        run: python3 scripts/mux_umbrel_release.py
      - name: Verify MUX security boundaries and exact MUX published ports
        run: |
          python3 -m unittest discover -s tests -p test_mux_umbrel_release.py -v
          python3 -m unittest discover -s tests -p test_mux_local_ai_umbrel_release.py -v
          python3 -m unittest discover -s tests -p test_mux_local_ai_umbrel_ui_release.py -v
