name: Validate AxePPC payout status delivery

on:
  pull_request:
    paths:
      - "willitmod-dev-ppc/**"
      - "PPC-PAYOUT-STATUS-2026-10-21.json"
      - "release-records/ppc-0.2.38-native-arm64-migration.json"
      - "scripts/ppc_payout_status_release.py"
      - "tests/test_ppc_payout_status_release.py"
      - ".github/workflows/validate-ppc-payout-status.yml"
  push:
    branches: [main]
    paths:
      - "willitmod-dev-ppc/**"
      - "PPC-PAYOUT-STATUS-2026-10-21.json"
      - "release-records/ppc-0.2.38-native-arm64-migration.json"
      - "scripts/ppc_payout_status_release.py"
      - "tests/test_ppc_payout_status_release.py"
      - ".github/workflows/validate-ppc-payout-status.yml"

permissions:
  contents: read

jobs:
  validate-ppc-payout-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/ppc_payout_status_release.py
      - run: python -m unittest discover -s tests -p 'test_ppc*.py' -v
