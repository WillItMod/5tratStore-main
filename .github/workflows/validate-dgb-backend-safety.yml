name: Validate AxeDGB backend isolation and data safety
on:
  pull_request:
    paths:
      - "willitmod-dev-dgb/**"
      - "DGB-BACKEND-SAFETY-2026-10-16.json"
      - "release-records/dgb-backend-safety-fixtures-2026-10-16.json"
      - "scripts/dgb_backend_release.py"
      - "scripts/dgb_gateway_release.py"
      - "release-records/dgb-gateway-hostname-delivery-2026-10-16.json"
      - "tests/test_dgb_gateway_release.py"
      - "tests/test_dgb_backend_safety.py"
      - "tests/test_dgb_backend_release.py"
      - ".github/workflows/validate-dgb-backend-safety.yml"
  push:
    branches: [main]
    paths:
      - "willitmod-dev-dgb/**"
      - "DGB-BACKEND-SAFETY-2026-10-16.json"
      - "release-records/dgb-backend-safety-fixtures-2026-10-16.json"
      - "scripts/dgb_backend_release.py"
      - "scripts/dgb_gateway_release.py"
      - "release-records/dgb-gateway-hostname-delivery-2026-10-16.json"
      - "tests/test_dgb_gateway_release.py"
      - "tests/test_dgb_backend_safety.py"
      - "tests/test_dgb_backend_release.py"
      - ".github/workflows/validate-dgb-backend-safety.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/dgb_gateway_release.py
      - run: python3 scripts/dgb_backend_release.py
      - run: python3 -m unittest discover -s tests -p 'test_dgb*.py' -v
