version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: powpow-app
      APP_PORT: 3000
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  init_permissions:
    image: alpine:3.22.1
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -ec
      - |-
        set -eu
        test -d /data
        test ! -L /data
        test -d /data/postgres-init
        test ! -L /data/postgres-init
        test -f /data/postgres-init/2-schema.sql
        test ! -L /data/postgres-init/2-schema.sql
        test "$$(stat -c '%h' /data/postgres-init/2-schema.sql)" = 1
        test "$$(stat -c '%s' /data/postgres-init/2-schema.sql)" -le 2097152
        test -f /data/postgres-init/3-multi-pool-partition.sql
        test ! -L /data/postgres-init/3-multi-pool-partition.sql
        test "$$(stat -c '%h' /data/postgres-init/3-multi-pool-partition.sql)" = 1
        test "$$(stat -c '%s' /data/postgres-init/3-multi-pool-partition.sql)" -le 2097152
        printf '%s\n' 'c9a0e0c871ddb7fe198e154903c053db1a26c614c5062d660af0add0e2fc8427  /data/postgres-init/2-schema.sql' '83a380949be2a2dd7b67a667575fc06133eae7be885ce458e0687803edc2f4bf  /data/postgres-init/3-multi-pool-partition.sql' | sha256sum -c -
        mkdir -p /data/ui/state /data/litecoin /data/dogecoin /data/pool/config /data/postgres
        chown -R 1000:1000 /data/ui /data/litecoin /data/dogecoin /data/pool /data/pool/config || true
        chown -R 70:70 /data/postgres || true
        chmod 700 /data/postgres || true

  app:
    stop_signal: SIGINT
    hostname: powpow-app
    image: ghcr.io/willitmod/powpow-app:0.2.37-mux.88f8fc0af57e@sha256:59994fb26f1b9b1daf2bf25bf528d190d3beda89acd65d80bd674b49696bed8d
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      init_permissions:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - powpow-app
      umbrel_main_network:
        aliases:
          - powpow-app
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      MUX_IDENTITY_URL: "http://172.17.0.1:21222/api/integrations/workers"
      APP_VERSION: "0.2.37"
      APP_CHANNEL: "MAIN"
      NETWORK_HOST_HINT: "${NETWORK_IP}"
      POOL_API_URL: "http://pool:8001"
      POSTGRES_PASSWORD: "${APP_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:3000/api/about', timeout=3); sys.exit(0 if r.status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  litecoin:
    stop_signal: SIGTERM
    stop_grace_period: 15m30s
    image: ghcr.io/willitmod/powpow-litecoin:0.2.32-dev
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      init_permissions:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "pid=$$(cat /data/litecoin/litecoind.pid 2>/dev/null || true); [ -n \"$$pid\" ] && kill -0 \"$$pid\" 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 3m

  dogecoin:
    stop_signal: SIGTERM
    stop_grace_period: 15m30s
    image: ghcr.io/willitmod/powpow-dogecoin:0.2.26-dev
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      init_permissions:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "pid=$$(cat /data/dogecoin/dogecoind.pid 2>/dev/null || true); [ -n \"$$pid\" ] && kill -0 \"$$pid\" 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 3m

  pool:
    image: ghcr.io/willitmod/powpow-pool:0.2.37-pool-startup.a443d6f3e552@sha256:b89d5e8c8e078fb200690b1b7ce941c2c995b18ba9cfa699ccac08ff6ddebea8
    restart: unless-stopped
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      litecoin:
        condition: service_started
      dogecoin:
        condition: service_started
    environment:
      WAIT_FOR_FULL_SYNC: "1"
    ports:
      - "9555:9555/tcp"
    volumes:
      - ${APP_DATA_DIR}/data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      init_permissions:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: "mergedmining"
      POSTGRES_PASSWORD: "${APP_PASSWORD}"
      POSTGRES_DB: "mergedmining"
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
      - ${APP_DATA_DIR}/data/postgres-init:/docker-entrypoint-initdb.d:ro

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network

x-5tratumos-stop-policy:
  version: 1
  services:
    litecoin:
      stop_signal: SIGTERM
      stop_grace_period: 15m30s
      user: 1000:1000
    dogecoin:
      stop_signal: SIGTERM
      stop_grace_period: 15m30s
      user: 1000:1000
